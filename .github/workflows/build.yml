name: Build 44 Vocals (VST3 Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --target Vocal44_VST3 --parallel

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: 44-Vocals-VST3
          path: build/Vocal44_artefacts/Release/VST3/
